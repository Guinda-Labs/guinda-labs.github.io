<!doctype html>
<html lang="es"><head><meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; font-src 'self' data:; object-src 'none'"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AULA-C · Estudio Octave</title><link rel="stylesheet" href="./tokens.css"><link rel="stylesheet" href="./style.css"><script type="module" src="./app.mjs"></script></head>
<body>
<header class="lab-barra" role="banner"><nav class="menus" data-label="app.apps">
<details class="cambiador-app"><summary>AULA-C ▾</summary><div><a href="../../lab/" data-text="app.lab"></a><a href="../../documento/" data-text="app.documento"></a><a href="../../folio/" data-text="app.folio"></a></div></details>
<details><summary data-text="menu.file"></summary><div><button data-action="new" data-text="action.new"></button><button data-action="open" data-text="action.open"></button><button data-action="save" data-text="action.save"></button></div></details>
<details><summary data-text="menu.edit"></summary><div><button data-action="undo" data-text="action.undo"></button><button data-action="redo" data-text="action.redo"></button></div></details>
<details><summary data-text="menu.insert"></summary><div><button data-action="section" data-text="action.section"></button></div></details>
<details><summary data-text="menu.run"></summary><div><button data-action="run" data-text="action.run" data-label="action.runShortcut" title="Ctrl+Enter"></button><button data-action="run-section" data-text="action.runSection" data-label="action.runSectionShortcut" title="Ctrl+Shift+Enter"></button><button id="stop" data-action="stop" data-text="action.stop" data-title="notice.loss" title="Esc"></button></div></details>
<details><summary data-text="menu.view"></summary><div><button data-action="palette" data-text="action.palette" data-label="action.paletteShortcut" title="Ctrl+K"></button><button data-action="theme" data-text="action.theme"></button><button data-action="clear" data-text="action.clear"></button></div></details>
<details><summary data-text="menu.help"></summary><div><button data-action="about" data-text="action.about"></button></div></details>
</nav><button id="run" class="primary" data-action="run" data-text="action.runPrimary" data-label="action.runShortcut" title="Ctrl+Enter" disabled></button><button id="theme" class="tema-icono" data-label="action.theme" data-title="action.theme">◐</button></header>
<input type="file" id="file" accept=".m" hidden>
<input type="file" id="uploads" multiple hidden><input type="file" id="folder" webkitdirectory multiple hidden>
<main>
<nav class="panel-tabs" aria-label="Vistas del estudio"><button type="button" data-view="script" aria-selected="true">Script</button><button type="button" data-view="console" aria-selected="false">Consola</button><button type="button" data-view="workspace" aria-selected="false">Variables</button><button type="button" data-view="figures" aria-selected="false">Figuras</button></nav>
<section class="script panel"><h2><span data-text="editor.title"></span><span id="filename"></span></h2><details class="project"><summary data-text="files.title"></summary><button data-action="folder" data-text="action.folder"></button><button data-action="upload" data-text="action.upload"></button><p data-text="files.drop"></p><ul id="project-files"></ul><div id="downloads"></div></details><div id="editor-host"><textarea id="fallback" spellcheck="false" data-label="editor.label"></textarea><iframe id="runtime" src="../salida/repl/index.html?kernel=xoctave&amp;toolbar=0" data-title="editor.label"></iframe></div></section>
<section class="workspace panel"><h2 data-text="workspace.title"></h2><div class="overflow"><table><thead><tr><th data-text="workspace.name"></th><th data-text="workspace.size"></th><th data-text="workspace.class"></th><th data-text="workspace.value"></th></tr></thead><tbody id="variables"></tbody></table></div><p id="empty" data-text="workspace.empty"></p><details class="history"><summary data-text="history.title"></summary><ol id="history"></ol></details></section>
<section class="console panel"><h2 data-text="console.title"></h2><pre id="console" role="log" aria-live="polite"></pre><form id="command-form"><label for="command">&gt;&gt;</label><input id="command" autocomplete="off" data-label="console.label" disabled><button id="send" data-text="action.send" disabled></button></form></section>
<section class="figures panel"><h2 data-text="figures.title"></h2><nav id="figure-tabs" role="tablist" data-label="figures.title"></nav><div id="figures"><p data-text="figures.empty"></p></div></section>
</main>
<footer class="barra-estado"><output id="state" role="status" aria-live="polite" data-text="state.loading"></output><span id="first" hidden><span id="first-text"></span><button id="dismiss" data-text="action.dismiss"></button></span><output id="offline" role="status"></output><span data-text="footer.main"></span><a href="./GPL-3.0.txt" data-text="footer.license"></a><a href="https://github.com/jupyter-xeus/xeus-octave" data-text="footer.source"></a></footer>
<dialog id="palette" data-label="action.palette"><form method="dialog"><input id="palette-search" data-label="palette.search" autocomplete="off"><button data-text="action.close"></button></form><div id="palette-list"></div></dialog>
</body></html>
